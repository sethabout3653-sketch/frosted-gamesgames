<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Frosted Games</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 100vw;
      min-height: 100vh;
      border: 0;
      outline: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe
    id="frostedGamesFrame"
    src="https://frosted-games.ai.studio/"
    title="Frosted Games"

    allow="
      accelerometer *;
      ambient-light-sensor *;
      autoplay *;
      bluetooth *;
      camera *;
      clipboard-read *;
      clipboard-write *;
      display-capture *;
      encrypted-media *;
      fullscreen *;
      gamepad *;
      geolocation *;
      gyroscope *;
      hid *;
      idle-detection *;
      local-fonts *;
      magnetometer *;
      microphone *;
      midi *;
      payment *;
      picture-in-picture *;
      publickey-credentials-get *;
      screen-wake-lock *;
      serial *;
      speaker-selection *;
      usb *;
      web-share *;
      window-management *;
      xr-spatial-tracking *
    "

    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"

    sandbox="
      allow-downloads
      allow-forms
      allow-modals
      allow-orientation-lock
      allow-pointer-lock
      allow-popups
      allow-popups-to-escape-sandbox
      allow-presentation
      allow-same-origin
      allow-scripts
      allow-storage-access-by-user-activation
      allow-top-navigation
      allow-top-navigation-by-user-activation
    "
  ></iframe>
</body>
</html>
