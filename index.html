<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Frosted Games</title>

  <!-- Put favicon.png in the same folder as this HTML file -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Optional Apple/iPhone home-screen icon -->
  <link rel="apple-touch-icon" href="favicon.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #frostedGamesFrame {
      display: block;
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      border: 0;
      outline: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe
    id="frostedGamesFrame"
    src="https://frosted-games.ai.studio/"
    title="Frosted Games"

    allow="
      accelerometer *;
      ambient-light-sensor *;
      autoplay *;
      bluetooth *;
      camera *;
      clipboard-read *;
      clipboard-write *;
      display-capture *;
      encrypted-media *;
      fullscreen *;
      gamepad *;
      geolocation *;
      gyroscope *;
      hid *;
      idle-detection *;
      local-fonts *;
      magnetometer *;
      microphone *;
      midi *;
      payment *;
      picture-in-picture *;
      publickey-credentials-get *;
      screen-wake-lock *;
      serial *;
      speaker-selection *;
      usb *;
      web-share *;
      window-management *;
      xr-spatial-tracking *
    "

    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</body>
</html>
